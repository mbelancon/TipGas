<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1100" height="700" fill="#ffffff"/>
  <text x="550" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">TipGas — wiring (STM32F411 Black Pill)</text>

  <!-- power rails for the Hall modules -->
  <line x1="60" y1="70" x2="60" y2="640" stroke="#dc2626" stroke-width="3"/>
  <line x1="80" y1="70" x2="80" y2="640" stroke="#111827" stroke-width="3"/>
  <text x="54" y="62" text-anchor="end" fill="#dc2626" font-weight="600">3V3</text>
  <text x="86" y="62" text-anchor="start" fill="#111827" font-weight="600">GND</text>

  <!-- KY-024 modules -->
  <g id="hall">
    <g transform="translate(110,78)">
      <rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <text x="10" y="19" font-weight="600" fill="#1e3a8a">S1 · KY-024</text>
      <text x="10" y="37" font-size="11" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text>
    </g>
  </g>
  <!-- generic module rows (S1..S9): y = 78 + 60*i -->
  <g font-size="11">
    <!-- rows drawn explicitly so the file stays self-contained -->
    <g transform="translate(110,138)"><rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="10" y="19" font-size="13" font-weight="600" fill="#1e3a8a">S2 · KY-024</text><text x="10" y="37" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text></g>
    <g transform="translate(110,198)"><rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="10" y="19" font-size="13" font-weight="600" fill="#1e3a8a">S3 · KY-024</text><text x="10" y="37" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text></g>
    <g transform="translate(110,258)"><rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="10" y="19" font-size="13" font-weight="600" fill="#1e3a8a">S4 · KY-024</text><text x="10" y="37" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text></g>
    <g transform="translate(110,318)"><rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="10" y="19" font-size="13" font-weight="600" fill="#1e3a8a">S5 · KY-024</text><text x="10" y="37" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text></g>
    <g transform="translate(110,378)"><rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="10" y="19" font-size="13" font-weight="600" fill="#1e3a8a">S6 · KY-024</text><text x="10" y="37" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text></g>
    <g transform="translate(110,438)"><rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="10" y="19" font-size="13" font-weight="600" fill="#1e3a8a">S7 · KY-024</text><text x="10" y="37" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text></g>
    <g transform="translate(110,498)"><rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="10" y="19" font-size="13" font-weight="600" fill="#1e3a8a">S8 · KY-024</text><text x="10" y="37" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text></g>
    <g transform="translate(110,558)"><rect width="150" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="10" y="19" font-size="13" font-weight="600" fill="#1e3a8a">S9 · KY-024</text><text x="10" y="37" fill="#1e3a8a">+ → 3V3 · G → GND · DO →</text></g>
  </g>

  <!-- power stubs (+ to 3V3, G to GND) and DO wires; module i at y0 = 78 + 60 i -->
  <g stroke-width="2" fill="none">
    <!-- + stubs -->
    <path d="M60 113 H110 M60 173 H110 M60 233 H110 M60 293 H110 M60 353 H110 M60 413 H110 M60 473 H110 M60 533 H110 M60 593 H110" stroke="#dc2626"/>
    <!-- G stubs (drawn short, dashed to show they go to GND rail) -->
    <path d="M80 104 H110 M80 164 H110 M80 224 H110 M80 284 H110 M80 344 H110 M80 404 H110 M80 464 H110 M80 524 H110 M80 584 H110" stroke="#111827"/>
    <!-- DO wires to MCU pins -->
    <path d="M260 101 H330 V160 H430" stroke="#2563eb"/>
    <path d="M260 161 H320 V185 H430" stroke="#2563eb"/>
    <path d="M260 221 H310 V210 H430" stroke="#2563eb"/>
    <path d="M260 281 H330 V235 H430" stroke="#2563eb"/>
    <path d="M260 341 H340 V260 H430" stroke="#2563eb"/>
    <path d="M260 401 H350 V285 H430" stroke="#2563eb"/>
    <path d="M260 461 H360 V310 H430" stroke="#2563eb"/>
    <path d="M260 521 H370 V335 H430" stroke="#2563eb"/>
    <path d="M260 581 H380 V360 H430" stroke="#2563eb"/>
  </g>
  <circle cx="60" cy="113" r="3.5" fill="#dc2626"/><circle cx="80" cy="104" r="3.5" fill="#111827"/><circle cx="60" cy="173" r="3.5" fill="#dc2626"/><circle cx="80" cy="164" r="3.5" fill="#111827"/><circle cx="60" cy="233" r="3.5" fill="#dc2626"/><circle cx="80" cy="224" r="3.5" fill="#111827"/><circle cx="60" cy="293" r="3.5" fill="#dc2626"/><circle cx="80" cy="284" r="3.5" fill="#111827"/><circle cx="60" cy="353" r="3.5" fill="#dc2626"/><circle cx="80" cy="344" r="3.5" fill="#111827"/><circle cx="60" cy="413" r="3.5" fill="#dc2626"/><circle cx="80" cy="404" r="3.5" fill="#111827"/><circle cx="60" cy="473" r="3.5" fill="#dc2626"/><circle cx="80" cy="464" r="3.5" fill="#111827"/><circle cx="60" cy="533" r="3.5" fill="#dc2626"/><circle cx="80" cy="524" r="3.5" fill="#111827"/><circle cx="60" cy="593" r="3.5" fill="#dc2626"/><circle cx="80" cy="584" r="3.5" fill="#111827"/><circle cx="780" cy="150" r="3.5" fill="#dc2626"/><circle cx="780" cy="210" r="3.5" fill="#16a34a"/><circle cx="895" cy="150" r="3" fill="#dc2626"/><circle cx="880" cy="210" r="3" fill="#16a34a"/><circle cx="865" cy="290" r="3" fill="#111827"/><circle cx="975" cy="150" r="3" fill="#dc2626"/><circle cx="960" cy="210" r="3" fill="#16a34a"/><circle cx="945" cy="290" r="3" fill="#111827"/><circle cx="1055" cy="150" r="3" fill="#dc2626"/><circle cx="1040" cy="210" r="3" fill="#16a34a"/><circle cx="1025" cy="290" r="3" fill="#111827"/>

  <!-- Black Pill board -->
  <rect x="430" y="110" width="220" height="420" rx="10" fill="#1f2937"/>
  <rect x="490" y="80" width="100" height="34" rx="4" fill="#9ca3af"/>
  <text x="540" y="102" text-anchor="middle" fill="#111827" font-weight="600">USB-C</text>
  <rect x="490" y="260" width="100" height="100" rx="4" fill="#374151" stroke="#6b7280"/>
  <text x="540" y="300" text-anchor="middle" fill="#e5e7eb" font-weight="600">STM32</text>
  <text x="540" y="318" text-anchor="middle" fill="#e5e7eb" font-weight="600">F411CEU6</text>
  <text x="540" y="338" text-anchor="middle" fill="#9ca3af" font-size="11">(or F411CCU6)</text>
  <text x="540" y="140" text-anchor="middle" fill="#f9fafb" font-size="15" font-weight="600">Black Pill</text>
  <g fill="#f9fafb" font-size="12" font-family="Consolas, Menlo, monospace">
    <text x="440" y="164">PB0  ← S1</text>
    <text x="440" y="189">PB1  ← S2</text>
    <text x="440" y="214">PA2  ← S3</text>
    <text x="440" y="239">PA3  ← S4</text>
    <text x="440" y="264">PA4 ← S5</text>
    <text x="440" y="289">PA5 ← S6</text>
    <text x="440" y="314">PA6 ← S7</text>
    <text x="440" y="339">PA7 ← S8</text>
    <text x="440" y="364">PA8 ← S9</text>
    <text x="440" y="420">3V3</text>
    <text x="440" y="445">GND</text>
    <text x="640" y="214" text-anchor="end">PB8</text>
    <text x="640" y="389" text-anchor="end">PB6</text>
    <text x="640" y="414" text-anchor="end">PB7</text>
    <text x="640" y="439" text-anchor="end">3V3</text>
    <text x="640" y="464" text-anchor="end">GND</text>
    <text x="640" y="239" text-anchor="end">3V3</text>
    <text x="640" y="264" text-anchor="end">GND</text>
  </g>
  <text x="540" y="505" text-anchor="middle" fill="#fbbf24" font-size="12">LED PC13 toggles at each tip</text>
  <!-- rail connections to the board -->
  <path d="M60 640 V660 H420 V416 H430" stroke="#dc2626" stroke-width="3" fill="none"/>
  <path d="M80 640 V650 H410 V441 H430" stroke="#111827" stroke-width="3" fill="none"/>

  <!-- DS18B20 bus -->
  <g stroke-width="2" fill="none">
    <path d="M650 210 H720" stroke="#16a34a"/>        <!-- DQ -->
    <path d="M650 235 H700 V150 H760" stroke="#dc2626"/>   <!-- 3V3 -->
    <path d="M650 260 H740 V290" stroke="#111827"/>    <!-- GND -->
    <path d="M720 210 H1060" stroke="#16a34a"/>
    <path d="M760 150 H1060" stroke="#dc2626"/>
    <path d="M740 290 H1060" stroke="#111827"/>
  </g>
  <!-- pull-up resistor between 3V3 and DQ -->
  <rect x="772" y="164" width="16" height="34" fill="#fef3c7" stroke="#b45309"/>
  <path d="M780 150 V164 M780 198 V210" stroke="#b45309" stroke-width="2"/>
  <text x="796" y="186" fill="#92400e" font-size="12">4.7 kΩ</text>
  <!-- three sensors -->
  <g font-size="11">
    <g transform="translate(860,226)"><path d="M10 -76 V12 M24 -16 V12 M38 64 V40" stroke="none"/></g>
  </g>
  <g>
    <g transform="translate(850,0)">
      <path d="M45 150 V230 M30 210 V230 M15 290 V262" stroke-width="2" fill="none" stroke="#6b7280"/>
      <rect x="0" y="230" width="60" height="32" rx="12" fill="#111827"/>
      <text x="30" y="251" text-anchor="middle" fill="#f9fafb" font-size="11">DS18B20</text>
    </g>
    <g transform="translate(930,0)">
      <path d="M45 150 V230 M30 210 V230 M15 290 V262" stroke-width="2" fill="none" stroke="#6b7280"/>
      <rect x="0" y="230" width="60" height="32" rx="12" fill="#111827"/>
      <text x="30" y="251" text-anchor="middle" fill="#f9fafb" font-size="11">DS18B20</text>
    </g>
    <g transform="translate(1010,0)">
      <path d="M45 150 V230 M30 210 V230 M15 290 V262" stroke-width="2" fill="none" stroke="#6b7280"/>
      <rect x="0" y="230" width="60" height="32" rx="12" fill="#111827"/>
      <text x="30" y="251" text-anchor="middle" fill="#f9fafb" font-size="11">… up to 9</text>
    </g>
  </g>
  <text x="850" y="140" fill="#dc2626" font-size="12">VDD (red)</text>
  <text x="796" y="228" fill="#16a34a" font-size="12">DQ (yellow)</text>
  <text x="850" y="308" fill="#111827" font-size="12">GND (black) · one sensor per cell</text>
  <text x="830" y="326" fill="#6b7280" font-size="11">TO-92, flat face toward you: GND · DQ · VDD</text>

  <!-- BME280 -->
  <g stroke-width="2" fill="none">
    <path d="M650 385 H860" stroke="#7c3aed"/>
    <path d="M650 410 H860" stroke="#7c3aed" stroke-dasharray="6 3"/>
    <path d="M650 435 H860" stroke="#dc2626"/>
    <path d="M650 460 H860" stroke="#111827"/>
  </g>
  <rect x="860" y="365" width="150" height="112" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="935" y="352" text-anchor="middle" fill="#5b21b6" font-weight="600">BME280 / BMP280 (optional)</text>
  <g font-size="12" fill="#5b21b6" font-family="Consolas, Menlo, monospace">
    <text x="872" y="389">SCL</text><text x="872" y="414">SDA</text><text x="872" y="439">VIN 3V3</text><text x="872" y="464">GND</text>
  </g>
  <text x="690" y="378" fill="#5b21b6" font-size="11">I²C1 · addr 0x76 / 0x77</text>

  <!-- USB to PC -->
  <path d="M540 80 V55 H760" stroke="#6b7280" stroke-width="3" fill="none"/>
  <rect x="760" y="40" width="150" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="835" y="62" text-anchor="middle" fill="#111827">PC · TipGas app</text>
  <text x="650" y="50" fill="#6b7280" font-size="11">USB CDC (virtual COM)</text>

  <!-- notes -->
  <g font-size="12" fill="#374151">
    <text x="680" y="545">• Power every KY-024 from <tspan font-weight="600">3V3</tspan> (not 5 V): DO then swings 0–3.3 V.</text>
    <text x="680" y="565">• Adjust each KY-024 trimpot so DO switches when the magnet passes.</text>
    <text x="680" y="585">• Default polarity: magnet = LOW (↓). Change per channel in the app.</text>
    <text x="680" y="605">• One 4.7 kΩ pull-up for the whole 1-Wire bus (PB8 → 3V3).</text>
    <text x="680" y="625">• Hall/DS18B20 cables: twisted or shielded for runs over ~1 m.</text>
  </g>
</svg>
