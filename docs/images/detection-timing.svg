<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">Tip detection on one channel (active-low sensor)</text>
  <text x="20" y="85" fill="#374151" font-weight="600">Hall DO</text>
  <text x="20" y="175" fill="#374151" font-weight="600">Accepted</text>
  <text x="20" y="245" fill="#374151" font-weight="600">State</text>
  <!-- signal: high, noise spike, real tip with bounce, lockout, second tip -->
  <path d="M110 60 H180 V100 H186 V60 H300 V100 H420 V60 H480 V100 H486 V60 H492 V100 H560 V60 H700 V100 H800 V60 H880"
        stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <text x="183" y="50" text-anchor="middle" fill="#b91c1c" font-size="11">spike &lt; 3 ms</text>
  <text x="183" y="122" text-anchor="middle" fill="#b91c1c" font-size="11">rejected</text>
  <!-- confirm window -->
  <rect x="300" y="104" width="18" height="10" fill="#fde68a"/>
  <text x="309" y="132" text-anchor="middle" fill="#92400e" font-size="11">3 ms confirm</text>
  <!-- accepted pulses -->
  <path d="M110 190 H300 V160 H306 V190 H700 V160 H706 V190 H880" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <text x="303" y="152" text-anchor="middle" fill="#166534" font-size="11">EV #n (t = first edge)</text>
  <text x="703" y="152" text-anchor="middle" fill="#166534" font-size="11">EV #n+1</text>
  <!-- lockout band -->
  <rect x="300" y="225" width="340" height="28" fill="#fee2e2" stroke="#ef4444"/>
  <text x="470" y="244" text-anchor="middle" fill="#991b1b">lockout (default 2000 ms): bounce and re-tips ignored</text>
  <rect x="700" y="225" width="180" height="28" fill="#fee2e2" stroke="#ef4444"/>
  <text x="790" y="244" text-anchor="middle" fill="#991b1b">lockout</text>
  <text x="486" y="122" text-anchor="middle" fill="#6b7280" font-size="11">magnet re-pass / bounce</text>
  <text x="450" y="285" text-anchor="middle" fill="#6b7280" font-size="12">EXTI fires on both edges · SysTick (1 ms) confirms the level · timestamp = edge time, 1 ms resolution, 64-bit counter</text>
</svg>
